<!doctype html>
<!--
  EXCON — researcher-only exercise-control display (SPEC/28 §8). SHOWS TRUTH.
  Served only by the Vite dev server (`npm run excon`, vite.config.ts `exconDevPage`); never part of the
  participant build (`vite build` / `npm run build:prod` refuse it) and never served by server/production.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="data:," />
    <title>EXCON — researcher only (shows truth)</title>
    <style>
      :root {
        --bg: #0d1117; --panel: #161b22; --panel2: #1c2128; --line: #30363d; --text: #c9d1d9; --dim: #8b949e;
        --accent: #f0b429; --danger: #f85149;
      }
      html, body, #excon { height: 100%; margin: 0; }
      body { background: var(--bg); color: var(--text); font: 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }
      .dim { color: var(--dim); }
      .small { font-size: 11px; }
      .excon { display: grid; height: 100vh; grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: 40px minmax(0, 1fr) auto;
        grid-template-areas: "hdr hdr" "maps side" "tl side"; }
      .hdr { grid-area: hdr; display: flex; align-items: center; gap: 16px; padding: 0 12px; background: #1a0f10; border-bottom: 2px solid var(--danger); min-width: 0; }
      .badge-excon { background: var(--danger); color: #fff; font-weight: 800; letter-spacing: .04em; padding: 3px 10px; border-radius: 4px; white-space: nowrap; }
      .hdr-mid { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .hdr-mid .clock { color: #fff; font-size: 15px; }
      .hdr-right { white-space: nowrap; }
      .chip { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; white-space: nowrap; }
      .chip-omission { background: #ff7b72; color: #0d1117; }
      .chip-contra { background: #ff2bd6; color: #0d1117; }
      .maps { grid-area: maps; display: flex; gap: 3px; background: #000; min-height: 0; }
      .map-pane { position: relative; flex: 1 1 0; min-width: 0; }
      .map-pane > .map { position: absolute; inset: 0; } /* beats .maplibregl-map { position: relative } */
      .map-title { position: absolute; top: 8px; left: 8px; z-index: 5; display: flex; flex-direction: column; gap: 1px; padding: 5px 9px; border-radius: 5px;
        background: rgba(13,17,23,.86); border: 1px solid var(--line); pointer-events: none; max-width: calc(100% - 30px); }
      .map-title strong { letter-spacing: .06em; font-size: 12px; }
      .map-title span { font-size: 11px; color: var(--dim); }
      .map-title.truth { border-color: var(--danger); }
      .map-title.truth strong { color: #ff8a80; }
      .map-title.part strong { color: #79c0ff; }
      .legend { position: absolute; left: 8px; bottom: 8px; z-index: 5; padding: 6px 8px; border-radius: 5px; background: rgba(13,17,23,.86); border: 1px solid var(--line); font-size: 11px; pointer-events: none; }
      .legend-row { display: flex; align-items: center; gap: 7px; line-height: 17px; }
      .sw { display: inline-block; width: 18px; height: 10px; border-radius: 2px; }
      .sw-line { height: 0; border-radius: 0; }
      .excon-symbol { cursor: default; line-height: 0; }
      .maplibregl-ctrl-scale { background: rgba(13,17,23,.8) !important; color: var(--text) !important; border-color: var(--text) !important; }
      .tl { grid-area: tl; background: var(--panel); border-top: 1px solid var(--line); padding: 6px 12px 10px; min-width: 0; }
      .tl-controls { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; flex-wrap: nowrap; min-width: 0; }
      .btn { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 5px; padding: 3px 9px; cursor: pointer; font-size: 12px; white-space: nowrap; }
      .btn:hover { border-color: #8b949e; }
      .btn-play { min-width: 76px; font-weight: 700; }
      .btn-speed.on { background: var(--accent); color: #0d1117; border-color: var(--accent); font-weight: 700; }
      .tl-sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
      .tl-readout { color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tl-legend { margin-left: auto; display: flex; gap: 10px; color: var(--dim); font-size: 11px; white-space: nowrap; }
      .tl-legend-item i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
      .tl-track { position: relative; height: 70px; cursor: pointer; user-select: none; }
      .tl-events { position: absolute; left: 0; right: 0; top: 0; height: 20px; }
      .tl-ev { position: absolute; top: 1px; transform: translateX(-50%); font: 700 10px/16px ui-monospace, Consolas, monospace; padding: 0 3px; min-width: 12px; text-align: center;
        border: 1px solid; border-radius: 8px; background: var(--bg); }
      .tl-views { position: absolute; left: 0; right: 0; top: 22px; height: 26px; display: flex; gap: 2px; }
      .tl-view { position: relative; min-width: 0; border-radius: 3px; display: flex; align-items: center; justify-content: center; opacity: .88; }
      .tl-view.practice { opacity: 1; }
      .tl-view-label { font: 700 11px/1 ui-monospace, Consolas, monospace; color: #0d1117; }
      .tl-view.practice .tl-view-label { color: var(--text); }
      .tl-step-split { position: absolute; left: 50%; top: 3px; bottom: 3px; border-left: 1px dashed rgba(13,17,23,.6); }
      .tl-hinge { position: absolute; top: 18px; height: 34px; border-left: 2px solid #f0f6fc; transform: translateX(-2px); }
      .tl-hinge span { position: absolute; top: -15px; right: 4px; font: 700 8.5px/1 ui-monospace, Consolas, monospace; color: #f0f6fc; letter-spacing: .05em; background: var(--panel); padding: 0 2px; }
      .tl-clocks { position: absolute; left: 0; right: 0; top: 52px; height: 14px; font-size: 9.5px; color: var(--dim); }
      .tl-clocks span { position: absolute; transform: translateX(2px); }
      .tl-head { position: absolute; top: 16px; height: 38px; border-left: 2px solid #fff; box-shadow: 0 0 6px #fff; pointer-events: none; }
      .side { grid-area: side; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 10px; min-height: 0; }
      .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
      .truth-card { border-color: #6e2b2b; }
      .view-title { font-size: 15px; color: #fff; }
      .row-between { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
      .row-gap { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 6px 0; }
      .kv { display: grid; grid-template-columns: 110px 1fr; gap: 3px 8px; font-size: 12px; margin: 4px 0; }
      .kv > span:nth-child(odd) { color: var(--dim); }
      .branches summary { cursor: pointer; color: var(--dim); font-size: 12px; margin-top: 4px; }
      .branches ul { margin: 4px 0 0; padding-left: 0; list-style: none; font-size: 12px; }
      .branches li { margin: 3px 0; }
      .mark { display: inline-block; min-width: 36px; font: 700 10px/16px ui-monospace, Consolas, monospace; text-align: center; border-radius: 3px; margin-right: 4px; }
      .mark.yes { background: #3fb950; color: #0d1117; } .mark.no { background: #30363d; } .mark.na { background: #6e7681; }
      .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 6px 0 8px; }
      .tab { background: none; border: none; color: var(--dim); padding: 6px 10px; cursor: pointer; font-size: 12px; border-bottom: 2px solid transparent; }
      .tab.on { color: #fff; border-bottom-color: var(--accent); }
      h4 { margin: 8px 0 6px; font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
      .ev-card { border-left-width: 3px; }
      .truth-line { margin-top: 4px; color: #ffb4a8; font-size: 12px; }
      .quote { margin-top: 4px; font-size: 12px; color: var(--text); font-style: italic; }
      .quote.en { color: var(--dim); }
      .ev-list { list-style: none; margin: 0; padding: 0; font-size: 12px; }
      .ev-list li { padding: 3px 4px; border-radius: 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .ev-list li:hover { background: var(--panel2); }
      .ev-list li.current { background: #2d2a1a; }
      .ev-glyph { display: inline-block; min-width: 16px; text-align: center; border: 1px solid; border-radius: 8px; font: 700 9px/14px ui-monospace, Consolas, monospace; margin-right: 4px; }
      .tbl { width: 100%; border-collapse: collapse; font-size: 11.5px; }
      .tbl th { text-align: left; color: var(--dim); font-weight: 600; border-bottom: 1px solid var(--line); padding: 3px 4px; position: sticky; top: 0; background: var(--panel); }
      .tbl td { border-bottom: 1px solid #21262d; padding: 3px 4px; vertical-align: top; }
      .tbl td.mono, .tbl td:first-child { white-space: nowrap; }
      .tbl tr { cursor: pointer; }
      .tbl tr.current td { background: #2d2a1a; }
      .tbl td.warn { color: #ffa657; }
      .tbl.cot td.uid { white-space: normal; word-break: break-all; }
      .xml { margin: 2px 0; white-space: pre-wrap; word-break: break-all; font: 10.5px/1.35 ui-monospace, Consolas, monospace; color: #a5d6ff; background: #0d1117; padding: 6px; border-radius: 4px; max-height: 260px; overflow: auto; }
      .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 4px; }
      .wind-arrow { display: inline-block; font-weight: 700; color: #79c0ff; }
      .msg-list { list-style: none; margin: 0; padding: 0; font-size: 12px; }
      .msg-list li { padding: 4px 0; border-bottom: 1px solid #21262d; color: var(--dim); }
      .msg-list li.done { color: var(--text); }
    </style>
  </head>
  <body>
    <div id="excon"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
